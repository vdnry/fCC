<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Cards</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main id="playing-cards">
    <div class="card">
      <div class="left">
        <div class="text">A</div>
        <div class="text">♠</div>
      </div>
      <div class="middle">
        <div class="text">♠</div>
        <div class="flip text">♠</div>
      </div>
      <div class="right">
        <div class="flip text">A</div>
        <div class="flip text">♠</div>
      </div>
    </div>
    <div class="card red">
      <div class="left">
        <div class="text">3</div>
        <div class="text">♦</div>
      </div>
      <div class="middle">
        <div class="text">♦</div>
        <div class="flip text">♦</div>
      </div>
      <div class="right">
        <div class="flip text">3</div>
        <div class="flip text">♦</div>
      </div>
    </div>
    <div class="card">
      <div class="left">
        <div class="text">5</div>
        <div class="text">♣</div>
      </div>
      <div class="middle">
        <div class="text">♣</div>
        <div class="flip text">♣</div>
      </div>
      <div class="right">
        <div class="flip text">5</div>
        <div class="flip text">♣</div>
      </div>
    </div>
    <div class="card red">
      <div class="left">
        <div class="text">7</div>
        <div class="text">♥</div>
      </div>
      <div class="middle">
        <div class="text">♥</div>
        <div class="flip text">♥</div>
      </div>
      <div class="right">
        <div class="flip text">7</div>
        <div class="flip text">♥</div>
      </div>
    </div>
    <div class="card">
      <div class="left">
        <div class="text">9</div>
        <div class="text">♠</div>
      </div>
      <div class="middle">
        <div class="text">♠</div>
        <div class="flip text">♠</div>
      </div>
      <div class="right">
        <div class="flip text">9</div>
        <div class="flip text">♠</div>
      </div>
    </div>
  </main>
</body>

</html>
