<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Book Inventory</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <h1>Book Inventory</h1>
  <section class="inventory">
    <table>
      <thead>
        <tr>
          <th>Title</th>
          <th>Author</th>
          <th>Category</th>
          <th>Status</th>
          <th>Rate</th>
        </tr>
      </thead>
      <tbody>
        <tr class="read">
          <th>Around the World in Eighty Days</th>
          <td>Jules Verne</td>
          <td>Adventure Fiction</td>
          <td>
            <span class="status">Read</span>
          </td>
          <td>
            <span class="rate three">
              <span></span>
              <span></span>
              <span></span>
            </span>
          </td>
        </tr>
        <tr class="read">
          <th>Diary of a Wimpy Kid</th>
          <td>Jeff Kinney</td>
          <td>Diary Fiction</td>
          <td>
            <span class="status">Read</span>
          </td>
          <td>
            <span class="rate two">
              <span></span>
              <span></span>
              <span></span>
            </span>
          </td>
        </tr>
        <tr class="in-progress">
          <th>Metro 2033</th>
          <td>Dmitry Glukhovsky</td>
          <td>Post-Apocalyptic Fiction</td>
          <td>
            <span class="status">In Progress</span>
          </td>
          <td>
            <span class="rate">
              <span></span>
              <span></span>
              <span></span>
            </span>
          </td>
        </tr>
        <tr class="to-read">
          <th>Three Thousand Stitches</th>
          <td>Sudha Murty</td>
          <td>Non-Fiction</td>
          <td>
            <span class="status">To Read</span>
          </td>
          <td>
            <span class="rate">
              <span></span>
              <span></span>
              <span></span>
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </section>
</body>

</html>
